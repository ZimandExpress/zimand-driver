<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Zimand Driver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0F2240">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zimand Driver">
</head>
<body>
  <div id="root"></div>
  <!-- Raportor scris ÎNAINTE de pachet, şi în afara lui.
       ====================================================================
       Un şofer a observat că ecranul alb îşi revenea la refresh. Asta
       exclude explicaţia cu comanda care cade din datele ei: aceeaşi
       comandă, după refresh, se desenează perfect. Dacă un refresh rezolvă,
       atunci de obicei codul nici nu a ajuns să ruleze — pachetul nu s-a
       încărcat. Plasa din React nu poate prinde asta, fiindcă ea stă chiar
       în pachetul care n-a pornit.
       De aceea raportorul stă aici, fără `type="module"` şi fără import,
       înaintea pachetului, ca să prindă chiar şi eşecul lui de încărcare. -->
  <script>
    (function () {
      var URL_BAZA = '%VITE_SUPABASE_URL%';
      var CHEIE = '%VITE_SUPABASE_ANON_KEY%';
      var trimise = 0;

      // Cel mult trei linii per deschidere: un raport care se repetă în
      // buclă ar fi mai rău decât lipsa lui.
      window.__zdRaport = function (ecran, mesaj, detaliu) {
        if (trimise >= 3) return;
        if (URL_BAZA.indexOf('http') !== 0) return;
        trimise++;
        var pachet = null;
        try {
          var s = document.querySelector('script[src*="/assets/"]');
          pachet = s ? s.getAttribute('src') : null;
        } catch (e) { /* nimic */ }
        try {
          fetch(URL_BAZA + '/rest/v1/app_errors', {
            method: 'POST',
            keepalive: true,                 // pleacă şi dacă pagina se reîncarcă
            headers: {
              'Content-Type': 'application/json',
              apikey: CHEIE,
              Authorization: 'Bearer ' + CHEIE,
              Prefer: 'return=minimal',
            },
            body: JSON.stringify({
              source_app: 'driver_app',
              ecran: ecran,
              message: String(mesaj).slice(0, 2000),
              stack: detaliu ? String(detaliu).slice(0, 6000) : null,
              app_version: pachet,
              url: location.href,
              user_agent: navigator.userAgent,
            }),
          }).catch(function () { /* raportarea n-are voie să strice nimic */ });
        } catch (e) { /* nimic */ }
      };

      window.addEventListener('error', function (ev) {
        // Un pachet care nu s-a încărcat: exact cazul „alb, dar refresh-ul
        // rezolvă". Numele fişierului cerut arată şi dacă telefonul cerea un
        // pachet vechi, rămas în service worker după o publicare.
        if (ev && ev.target && ev.target.tagName === 'SCRIPT') {
          window.__zdRaport('pachet-neincarcat',
            'script nu s-a încărcat: ' + (ev.target.getAttribute('src') || '?'));
          return;
        }
        if (ev && ev.message) {
          window.__zdRaport('inainte-de-react', ev.message, ev.error && ev.error.stack);
        }
      }, true);
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
  <!-- Plasă de siguranţă pentru ecranul alb.
       ====================================================================
       O aplicaţie instalată îşi ţine fişierele în service worker. Dacă
       acolo rămâne un amestec — pagina dintr-o versiune, pachetul din alta,
       fiindcă s-au publicat mai multe una după alta cât telefonul avea
       aplicaţia deschisă — browserul cere un fişier care nu mai există.
       Nu se desenează nimic, iar şoferul rămâne cu ecranul alb.

       Codul aplicaţiei nu poate prinde asta: el stă CHIAR în pachetul care
       nu s-a încărcat. De aceea plasa e scrisă aici, în pagină, fără
       `type="module"` şi fără import — ea porneşte chiar dacă tot restul
       cade. (Prima variantă am pus-o în main.jsx; proba a arătat că acolo
       e inutilă, fiindcă nu apucă să ruleze.)

       Singura ieşire era ca şoferul să şteargă datele aplicaţiei din
       setările telefonului. Acum încearcă aplicaţia singură: dacă după opt
       secunde ecranul e tot gol, şterge service worker-ul şi cache-urile,
       apoi reîncarcă.

       O SINGURĂ dată per deschidere, însemnat în sessionStorage: dacă
       ecranul alb vine din altceva, reîncărcarea nu rezolvă nimic, iar o
       buclă de reîncărcări ar fi mai rea decât pagina albă. -->
  <script>
    (function () {
      var CHEIE = 'zd-incercat-curatarea';
      window.addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) return;      // s-a desenat
          try { if (sessionStorage.getItem(CHEIE)) return; } catch (e) { return; }
          try { sessionStorage.setItem(CHEIE, '1'); } catch (e) { return; }

          // Spunem şi în baza de date că plasa a pornit. Altfel aplicaţia se
          // vindecă în silenţiu şi n-am afla niciodată că un şofer a văzut
          // alb — exact ce ne-a lipsit până acum.
          try {
            if (window.__zdRaport) {
              window.__zdRaport('ecran-alb-plasa', 'ecranul a rămas gol 8 secunde după încărcare');
            }
          } catch (e) { /* nimic */ }

          // Uităm comanda deschisă înainte de reîncărcare. Aplicaţia ţine
          // minte ce comandă era deschisă, ca să revină acolo după un
          // refresh — bun în mod normal, dar dacă tocmai ACEA comandă a
          // albit ecranul, reîncărcarea o redeschide şi albeşte iarăşi.
          // Aşa rămâneau şoferii blocaţi: nu cădea o dată, cădea în buclă.
          try {
            sessionStorage.removeItem('zd-open-order');
            sessionStorage.removeItem('zd-open-completed');
          } catch (e) { /* mergem mai departe */ }

          var pasi = [];
          try {
            if ('serviceWorker' in navigator) {
              pasi.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }));
            }
            if (window.caches) {
              pasi.push(caches.keys().then(function (nume) {
                return Promise.all(nume.map(function (n) { return caches.delete(n); }));
              }));
            }
          } catch (e) { /* mergem mai departe */ }

          // Reîncărcăm şi dacă curăţarea se blochează: trei secunde sunt
          // de ajuns, iar o aplicaţie albă n-are ce aştepta mai mult.
          var gata = false;
          function reincarca() { if (!gata) { gata = true; window.location.reload(); } }
          setTimeout(reincarca, 3000);
          Promise.all(pasi).then(reincarca, reincarca);
        }, 8000);
      });
    })();
  </script>
</body>
</html>
