# Construiește aplicația Android Zimand Driver (com.zimandsoftware.driver) în cloud.
# Rulează la fiecare push pe ramura `android` sau manual din tab-ul Actions.
#
# Rezultate (pagina rulării, secțiunea „Artifacts"):
#   - zimand-driver-test-apk  — APK de test, de instalat direct pe telefon;
#   - zimand-driver-play-aab  — pachetul semnat pentru Google Play (doar dacă
#     secretele cu cheia de încărcare sunt setate în repository).
name: Android build

on:
  push:
    branches: [android]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Număr de versiune nou la fiecare construcție (Google Play îl cere crescător).
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalare dependințe
        run: npm install

      # Aplicația încarcă versiunea live de pe driver.zimandexpress.de;
      # build-ul local servește doar ca rezervă la pornire.
      - name: Build web
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://vayshseythlogtumefzq.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder

      - name: Sincronizare Capacitor
        run: npx cap sync android

      - name: Build APK de test
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: zimand-driver-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # --- Pachetul semnat pentru Google Play -------------------------------
      - name: Cheia de încărcare
        id: cheie
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "Secretele cu cheia nu sunt setate — sar peste pachetul pentru Play."
            echo "are=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "are=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build AAB pentru Google Play
        if: steps.cheie.outputs.are == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: steps.cheie.outputs.are == 'true'
        with:
          name: zimand-driver-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Șterge cheia de pe server
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
